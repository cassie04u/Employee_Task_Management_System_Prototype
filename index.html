<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ETMS · Employee Task Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e6ecf4;
        --blob1: #9fc6ff;
        --blob2: #b6e6d2;
        --blob3: #f6d2b6;
        --glass: rgba(255, 255, 255, 0.56);
        --glass-strong: rgba(255, 255, 255, 0.82);
        --glass-line: rgba(255, 255, 255, 0.9);
        --edge: rgba(21, 38, 66, 0.09);
        --hover: rgba(21, 38, 66, 0.05);
        --text: #15202f;
        --muted: #566376;
        --faint: #8793a3;
        --accent: #2356d4;
        --accent-ink: #fff;
        --accent-soft: rgba(35, 86, 212, 0.11);
        --ok: #11825a;
        --ok-soft: rgba(17, 130, 90, 0.12);
        --warn: #ad6a10;
        --warn-soft: rgba(203, 132, 30, 0.15);
        --bad: #c4362c;
        --bad-soft: rgba(196, 54, 44, 0.11);
        --neutral-soft: rgba(21, 38, 66, 0.07);
        --admin: #a1600f;
        --manager: #0c7a6c;
        --employee: #2356d4;
        --shadow: 0 18px 40px -22px rgba(19, 38, 72, 0.35);
        --inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --sheen-a: rgba(255, 255, 255, 0.34);
        --sheen-b: rgba(255, 255, 255, 0.08);
        --r-xl: 26px;
        --r-lg: 18px;
        --r-md: 12px;
        --r-sm: 9px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1524;
          --blob1: #1e3f7a;
          --blob2: #0e4a45;
          --blob3: #4a2e23;
          --glass: rgba(24, 34, 54, 0.55);
          --glass-strong: rgba(28, 40, 62, 0.9);
          --glass-line: rgba(255, 255, 255, 0.08);
          --edge: rgba(255, 255, 255, 0.08);
          --hover: rgba(255, 255, 255, 0.05);
          --text: #e8edf5;
          --muted: #9ba8bb;
          --faint: #6d7a8e;
          --accent: #76a0ff;
          --accent-ink: #0b1426;
          --accent-soft: rgba(118, 160, 255, 0.15);
          --ok: #4ccb94;
          --ok-soft: rgba(76, 203, 148, 0.14);
          --warn: #f0b35a;
          --warn-soft: rgba(240, 179, 90, 0.14);
          --bad: #ff7a6e;
          --bad-soft: rgba(255, 122, 110, 0.13);
          --neutral-soft: rgba(255, 255, 255, 0.07);
          --admin: #f0b35a;
          --manager: #4fd1bd;
          --employee: #76a0ff;
          --shadow: 0 20px 44px -24px rgba(0, 0, 0, 0.7);
          --sheen-a: rgba(255, 255, 255, 0.07);
          --sheen-b: rgba(255, 255, 255, 0.01);
          --inset: inset 0 1px 0 rgba(255, 255, 255, 0.05);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1524;
        --blob1: #1e3f7a;
        --blob2: #0e4a45;
        --blob3: #4a2e23;
        --glass: rgba(24, 34, 54, 0.55);
        --glass-strong: rgba(28, 40, 62, 0.9);
        --glass-line: rgba(255, 255, 255, 0.08);
        --edge: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.05);
        --text: #e8edf5;
        --muted: #9ba8bb;
        --faint: #6d7a8e;
        --accent: #76a0ff;
        --accent-ink: #0b1426;
        --accent-soft: rgba(118, 160, 255, 0.15);
        --ok: #4ccb94;
        --ok-soft: rgba(76, 203, 148, 0.14);
        --warn: #f0b35a;
        --warn-soft: rgba(240, 179, 90, 0.14);
        --bad: #ff7a6e;
        --bad-soft: rgba(255, 122, 110, 0.13);
        --neutral-soft: rgba(255, 255, 255, 0.07);
        --admin: #f0b35a;
        --manager: #4fd1bd;
        --employee: #76a0ff;
        --shadow: 0 20px 44px -24px rgba(0, 0, 0, 0.7);
        --sheen-a: rgba(255, 255, 255, 0.07);
        --sheen-b: rgba(255, 255, 255, 0.01);
        --inset: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Manrope",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(38vw 34vw at 8% 12%, var(--blob1), transparent 70%),
          radial-gradient(34vw 30vw at 92% 18%, var(--blob2), transparent 70%),
          radial-gradient(40vw 34vw at 70% 96%, var(--blob3), transparent 70%),
          var(--bg);
        opacity: 0.9;
      }
      img {
        max-width: 100%;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid var(--glass-line);
        box-shadow: var(--shadow), var(--inset);
        border-radius: var(--r-lg);
      }
      .ic {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        border-radius: var(--r-md);
        border: 1px solid var(--edge);
        background: var(--glass-strong);
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.05s;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.danger.solid {
        background: var(--bad);
        color: #fff;
        border-color: transparent;
      }
      .btn.ok {
        color: var(--ok);
      }
      .btn.sm {
        height: 32px;
        padding: 0 11px;
        font-size: 13px;
        border-radius: var(--r-sm);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: var(--hover);
      }
      .btn[disabled] {
        opacity: 0.5;
        pointer-events: none;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        display: inline-grid;
        place-items: center;
        border-radius: var(--r-md);
        border: 1px solid var(--edge);
        background: var(--glass-strong);
        cursor: pointer;
        position: relative;
      }
      .icon-btn:hover {
        border-color: var(--accent);
      }
      .icon-btn.sm {
        width: 32px;
        height: 32px;
        border-radius: var(--r-sm);
      }

      /* forms */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field label {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .field .hint {
        font-size: 12px;
        color: var(--faint);
      }
      .input,
      select.input,
      textarea.input {
        width: 100%;
        height: 42px;
        padding: 0 13px;
        border-radius: var(--r-md);
        border: 1px solid var(--edge);
        background: var(--glass-strong);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      textarea.input {
        height: auto;
        min-height: 92px;
        padding: 10px 13px;
        resize: vertical;
        line-height: 1.5;
      }
      .input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        cursor: pointer;
      }
      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      .form-error {
        color: var(--bad);
        font-size: 13px;
        font-weight: 600;
        min-height: 1em;
      }

      /* pills */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        background: var(--neutral-soft);
        color: var(--muted);
      }
      .pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .pill.plain::before {
        display: none;
      }
      .s-todo {
        background: var(--neutral-soft);
        color: var(--muted);
      }
      .s-in_progress {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .s-submitted {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .s-completed {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .s-overdue {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .p-low {
        color: var(--faint);
      }
      .p-medium {
        color: var(--accent);
      }
      .p-high {
        color: var(--warn);
      }
      .p-urgent {
        color: var(--bad);
      }
      .prio {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 700;
      }
      .prio svg {
        width: 14px;
        height: 14px;
      }
      .role {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid currentColor;
      }
      .r-admin {
        color: var(--admin);
      }
      .r-manager {
        color: var(--manager);
      }
      .r-employee {
        color: var(--employee);
      }
      .ps-planning {
        color: var(--muted);
      }
      .ps-active {
        color: var(--accent);
      }
      .ps-on_hold {
        color: var(--warn);
      }
      .ps-completed {
        color: var(--ok);
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 800;
        color: #fff;
        flex: none;
        letter-spacing: 0.02em;
      }
      .avatar.lg {
        width: 56px;
        height: 56px;
        font-size: 18px;
      }
      .avatar.sm {
        width: 26px;
        height: 26px;
        font-size: 10.5px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .who .n {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who .e {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ===== auth screens ===== */
      .auth {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 48px;
        padding: 48px clamp(20px, 6vw, 88px);
        max-width: 1280px;
        margin: 0 auto;
      }
      .auth-copy h1 {
        font-size: clamp(2.4rem, 5.2vw, 4.4rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.02;
        max-width: 12ch;
      }
      .auth-copy p {
        margin-top: 20px;
        font-size: 17px;
        color: var(--muted);
        max-width: 44ch;
      }
      .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        margin-bottom: 40px;
        font-size: 17px;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: var(--text);
      }
      .auth-brand:hover .mark {
        filter: brightness(1.1);
      }
      .auth-alt {
        text-align: center;
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .mark svg {
        width: 19px;
        height: 19px;
      }
      .role-row {
        display: flex;
        gap: 10px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      .role-card {
        padding: 12px 14px;
        border-radius: var(--r-md);
        background: var(--glass);
        border: 1px solid var(--glass-line);
        font-size: 13px;
        color: var(--muted);
        max-width: 180px;
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      .role-card b {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .auth-card {
        padding: 34px;
        border-radius: var(--r-xl);
        max-width: 440px;
        width: 100%;
        justify-self: end;
      }
      .auth-card h2 {
        font-size: 24px;
        font-weight: 800;
      }
      .auth-card .sub {
        color: var(--muted);
        margin: 6px 0 24px;
      }
      .demo {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--edge);
      }
      .demo p {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .demo-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--edge);
        background: var(--glass-strong);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chip:hover {
        border-color: var(--accent);
      }
      .linkbtn {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .linkbtn:hover {
        text-decoration: underline;
      }
      .pw-show {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-radius: var(--r-md);
        background: var(--accent-soft);
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      /* ===== shell ===== */
      .shell {
        display: grid;
        grid-template-columns: 252px minmax(0, 1fr);
        gap: 20px;
        padding: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 1560px;
        margin: 0 auto;
      }
      .side {
        position: sticky;
        top: calc(18px + env(safe-area-inset-top, 0px));
        height: calc(
          100dvh - 36px - env(safe-area-inset-top, 0px) -
            env(safe-area-inset-bottom, 0px)
        );
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        border-radius: var(--r-xl);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 18px;
      }
      .brand b {
        font-weight: 800;
        font-size: 16px;
        display: block;
        line-height: 1.2;
      }
      .brand small {
        color: var(--muted);
        font-size: 12px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: 6px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 42px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        border-radius: var(--r-md);
        cursor: pointer;
        color: var(--muted);
        font-weight: 600;
        text-align: left;
        position: relative;
      }
      .nav button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .nav button[aria-current="page"] {
        background: var(--glass-strong);
        color: var(--text);
        box-shadow:
          0 1px 0 var(--edge),
          0 6px 16px -10px rgba(0, 0, 0, 0.3);
      }
      .nav button[aria-current="page"] .ic {
        color: var(--accent);
      }
      .nav .count {
        margin-left: auto;
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 11.5px;
        font-weight: 800;
        display: grid;
        place-items: center;
      }
      .side-foot {
        margin-top: auto;
        padding: 12px 8px 2px;
        border-top: 1px solid var(--edge);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .side-foot .who {
        flex: 1;
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-bottom: 30px;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
        min-height: 44px;
      }
      .topbar > button {
        flex: none;
      }
      .topbar .mobile-brand {
        display: none;
        margin-right: auto;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        min-width: 0;
      }
      .topbar .mobile-brand span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--bad);
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        display: grid;
        place-items: center;
        border: 2px solid var(--bg);
      }
      .me-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px 0 5px;
        border-radius: 999px;
        border: 1px solid var(--edge);
        background: var(--glass-strong);
        cursor: pointer;
      }
      .me-btn:hover {
        border-color: var(--accent);
      }
      .me-btn .nm {
        font-weight: 700;
        font-size: 14px;
      }
      .bottom-nav {
        display: none;
      }

      /* page */
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .page-head h1 {
        font-size: clamp(1.6rem, 2.6vw, 2.1rem);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .page-head .sub {
        color: var(--muted);
        margin-top: 4px;
      }
      .head-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hero {
        padding: 6px 2px 4px;
      }
      .hero .date {
        color: var(--muted);
        font-weight: 600;
      }
      .hero h1 {
        font-size: clamp(2rem, 4.2vw, 3.3rem);
        font-weight: 800;

      .bad {

      .warnc {
        color: var(--warn);

      .okc {

        flex-direction: column;

        background: var(--neutral-soft);
        color: var(--muted);

        font-weight: 700;

      .notif .when {
        font-size: 12.5px;
        color: var(--faint);
        margin-top: 2px;

      .notif .dotu {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 14px;
        flex: none;

      /* modal */
      .modal-bg {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(10, 18, 32, 0.34);

        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        padding: 20px;
        padding-top: calc(20px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        animation: fade 0.16s ease;

      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 100%;
        overflow: auto;
        padding: 24px;
        border-radius: var(--r-xl);
        background: var(--glass-strong);
        animation: pop 0.18s ease;
      }
      .modal.wide {
        max-width: 760px;
      }
      .modal-h {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }
      .modal-h h2 {
        font-size: 21px;
        font-weight: 800;
      }
      .modal-h .sub {
        color: var(--muted);
        font-size: 13.5px;
        margin-top: 4px;
      }
      .modal-f {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
        flex-wrap: wrap;
      }
      .modal-f .left {
        margin-right: auto;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 18px;
        padding: 16px;
        border-radius: var(--r-md);
        background: var(--neutral-soft);
      }
      .facts dt {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .facts dd {
        margin: 0;
        font-weight: 700;
        font-size: 14px;
      }
      .block {
        margin-top: 18px;
      }
      .block h4 {
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 6px;
      }
      .block .body {
        white-space: pre-wrap;
        font-size: 14.5px;
      }
      .callout {
        padding: 12px 14px;
        border-radius: var(--r-md);
        font-size: 14px;
        white-space: pre-wrap;

        background: var(--warn-soft);

      .callout.info {
        background: var(--accent-soft);
      }
      .callout.ok {
        background: var(--ok-soft);
      }
      .callout b {
        display: block;
        font-size: 12.5px;
        margin-bottom: 3px;

      .timeline {

        padding: 0 0 12px 16px;

      .toasts {

        flex-direction: column;
        gap: 8px;
        align-items: center;
        pointer-events: none;

        display: grid;
        grid-template-columns: repeat(3, 1fr);

        background: var(--neutral-soft);

        font-weight: 600;

      .profile-card {

      .settings-sec {

        font-size: 14px;

      .kv:first-child {
        border-top: 0;
      }
      .kv span {
        color: var(--muted);
      }

      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g-3-2,
        .g-rep {
          grid-template-columns: 1fr;
        }
        .board {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 860px) {
        .shell {

          padding: 14px 14px 96px;

        }

        }
        .me-btn .nm {
          display: none;
        }
        .me-btn {
          padding: 0 4px;
        }
        .bottom-nav {
          display: flex;
          position: fixed;
          left: 12px;
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom, 0px));
          z-index: 40;
          padding: 6px;
          border-radius: 20px;
          justify-content: space-around;
        }
        .bottom-nav button {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          padding: 7px 2px;
          border: 0;
          background: transparent;
          border-radius: 14px;
          font-size: 11px;
          font-weight: 700;
          color: var(--muted);

        .bottom-nav button[aria-current="page"] {
          color: var(--accent);
          background: var(--glass-strong);
        }
        .bottom-nav .badge-dot {
          top: 2px;
          right: calc(50% - 20px);
        }
        .g-2 {
          grid-template-columns: 1fr;
        }
        .auth {
          grid-template-columns: 1fr;
          gap: 28px;
          padding: 32px 18px;
        }
        .auth-card {
          justify-self: stretch;
          max-width: none;
          padding: 24px;
        }
        .auth-brand {
          margin-bottom: 22px;
        }
        .role-row {
          display: none;
        }
        .settings-sec {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .facts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 560px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
        .board {
          grid-template-columns: 1fr;
        }
        .kpi .v {
          font-size: 25px;
        }
        .modal {
          padding: 20px;
        }
        .search {
          max-width: none;
        }
        .report-sum b {
          font-size: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

            if (v && typeof v === "object") {
              if ("__d" in v) {
                const d = new Date(base);
                d.setDate(d.getDate() + v.__d);
                return ymd(d);
              }
              if ("__t" in v) {
                const d = new Date(base);
                d.setDate(d.getDate() + v.__t[0]);
                d.setHours(v.__t[1]);
                return d.toISOString();
              }
              const o = {};
              for (const k in v) o[k] = fix(v[k]);
              return o;
            }
            return v;
          };
          const data = {};
          for (const c of COLS) {
            data[c] = {};
            const src = DEMO_SEED[c] || {};
            for (const id in src) data[c][id] = { ...fix(src[id]), id };
          }
          return { data, settings: { ...DEFAULT_SETTINGS, ...DEMO_SETTINGS } };
        }

        /* ================= store (cloud db or this browser) ================= */
        const Store = {
          mode: "local",
          db: null,
          ready: false,
          data: {
            users: {},
            projects: {},
            tasks: {},
            notifications: {},
            reports: {},
            resets: {},
          },
          settings: { ...DEFAULT_SETTINGS },
          _q: {},
          async init() {
            let db = null;
            try {
              if (window.claude && typeof window.claude.use === "function") {
                db = await Promise.race([
                  window.claude.use("db"),
                  new Promise((r) => setTimeout(() => r(null), 9000)),
                ]);
              }
            } catch {
              db = null;
            }
            if (db) {
              this.mode = "cloud";
              this.db = db;
              await this.subscribe();
            } else {
              this.mode = "local";
              this.loadLocal();
              window.addEventListener("storage", (e) => {
                if (e.key === DATA_KEY) {
                  this.loadLocal();
                  scheduleRender();
                }
              });
            }
            this.ready = true;
          },
          subscribe() {
            return new Promise((resolve) => {
              const pending = new Set([...COLS, "settings"]);
              const done = (k) => {
                if (pending.delete(k) && pending.size === 0) resolve();
              };
              setTimeout(resolve, 6000);
              COLS.forEach((c) => {
                this.db.collection("ems_" + c).onSnapshot(
                  (snap) => {
                    const o = {};
                    snap.docs.forEach((d) => {
                      o[d.id] = { ...d.data(), id: d.id };
                    });
                    this.data[c] = o;
                    if (!snap.metadata.fromCache) done(c);
                    scheduleRender();
                  },
                  (err) => {
                    done(c);
                    dbError(err);
                  },
                );
              });
              this.db.doc("ems_meta/settings").onSnapshot(
                (s) => {
                  if (s.exists)
                    this.settings = { ...DEFAULT_SETTINGS, ...s.data() };
                  if (!s.metadata.fromCache) done("settings");
                  scheduleRender();
                },
                (err) => {
                  done("settings");
                  dbError(err);
                },
              );
            });
          },
          loadLocal() {
            try {
              const raw = LS.get(DATA_KEY);
              if (raw) {
                const p = JSON.parse(raw);
                this.data = { ...this.data, ...(p.data || {}) };
                this.settings = { ...DEFAULT_SETTINGS, ...(p.settings || {}) };
              } else {
                const d = buildDemo();
                this.data = { ...this.data, ...d.data };
                this.settings = d.settings;
                this.saveLocal();
              }
            } catch {}
          },
          saveLocal() {
            LS.set(
              DATA_KEY,
              JSON.stringify({ data: this.data, settings: this.settings }),
            );
          },
          q(path, fn) {
            const prev = this._q[path] || Promise.resolve();
            const p = prev.catch(() => {}).then(fn);
            this._q[path] = p;
            return p;
          },
          async write(c, id, obj) {
            const clean = { ...obj };
            delete clean.id;
            this.data[c] = { ...this.data[c], [id]: { ...clean, id } };
            scheduleRender();
            if (this.mode === "cloud") {
              try {
                await this.q(c + "/" + id, () =>
                  this.db.doc("ems_" + c + "/" + id).set(clean),
                );
              } catch (e) {
                dbError(e);
                throw e;
              }
            } else this.saveLocal();
          },
          patch(c, id, p) {
            const cur = this.data[c][id];
            if (!cur) return Promise.resolve();
            return this.write(c, id, { ...cur, ...p });
          },
          async remove(c, id) {
            const n = { ...this.data[c] };
            delete n[id];
            this.data[c] = n;
            scheduleRender();
            if (this.mode === "cloud") {
              try {
                await this.q(c + "/" + id, () =>
                  this.db.doc("ems_" + c + "/" + id).delete(),
                );
              } catch (e) {
                dbError(e);
                throw e;
              }
            } else this.saveLocal();
          },
          async saveSettings(s) {
            this.settings = { ...this.settings, ...s };
            scheduleRender();
            if (this.mode === "cloud") {
              try {
                await this.q("meta", () =>
                  this.db.doc("ems_meta/settings").set(this.settings),
                );
              } catch (e) {
                dbError(e);
                throw e;
              }
            } else this.saveLocal();
          },
          list(c) {
            return Object.values(this.data[c] || {});
          },
        };
        let dbErrShown = 0;
        function dbError(e) {
          if (Date.now() - dbErrShown < 4000) return;
          dbErrShown = Date.now();
          const code = e && e.code;
          if (code === "invalid_argument")
            toast(
              "You have view-only access to this workspace, so changes can’t be saved.",
              "bad",
            );
          else if (code === "quota_exceeded")
            toast(
              "Storage is full. Delete old notifications or reports to free space.",
              "bad",
            );
          else if (code === "revoked")
            toast("Access to this workspace was removed.", "bad");
          else
            toast(
              "Couldn’t save that change. Check your connection and try again.",
              "bad",
            );
        }

        /* ================= session & state ================= */
        let sessionId = LS.get(SESSION_KEY);
        function me() {
          const u = sessionId && Store.data.users[sessionId];
          return u && u.active !== false ? u : null;
        }
        const state = {
          view: "dashboard",
          f: {},
          report: null,
          remindersRunFor: null,
          auth: "login",
        };
        const users = () => Store.list("users");
        const userById = (id) => Store.data.users[id];
        const userName = (id) => {
          const u = userById(id);
          return u ? u.name : "Former user";
        };
        const projectById = (id) => Store.data.projects[id];
        const isOverdue = (t) =>
          t.status !== "completed" &&
          t.status !== "submitted" &&
          t.dueDate &&
          daysUntil(t.dueDate) < 0;
        const isOpen = (t) => t.status !== "completed";
        function managerOf(t) {
          const p = projectById(t.projectId);
          return (p && p.managerId) || t.createdBy;
        }
        function scopedProjects(u) {
          return Store.list("projects").filter(
            (p) => u.role === "admin" || p.managerId === u.id,
          );
        }
        function scopedTasks(u) {
          const all = Store.list("tasks");
          if (u.role === "admin") return all;
          if (u.role === "employee")
            return all.filter((t) => t.assigneeId === u.id);
          const mine = new Set(scopedProjects(u).map((p) => p.id));
          return all.filter(
            (t) => mine.has(t.projectId) || t.createdBy === u.id,
          );
        }
        function projectStats(pid) {
          const ts = Store.list("tasks").filter((t) => t.projectId === pid);
          const c = {
            total: ts.length,
            todo: 0,
            in_progress: 0,
            submitted: 0,
            completed: 0,
            overdue: 0,
          };
          ts.forEach((t) => {
            c[t.status] = (c[t.status] || 0) + 1;
            if (isOverdue(t)) c.overdue++;
          });
          c.pct = c.total ? Math.round((c.completed / c.total) * 100) : 0;
          return c;
        }
        function pendingResets() {
          return Store.list("resets")
            .filter((r) => userById(r.userId))
            .sort((a, b) =>
              (b.requestedAt || "").localeCompare(a.requestedAt || ""),
            );
        }
        function myNotifs() {
          const u = me();
          return u
            ? Store.list("notifications")
                .filter((n) => n.userId === u.id)
                .sort((a, b) =>
                  (b.sendDate || "").localeCompare(a.sendDate || ""),
                )
            : [];
        }
        function unreadCount() {
          return myNotifs().filter((n) => !n.read).length;
        }
        function notify(userId, message, taskId = null, type = "info") {
          if (!userId) return;
          const id = uid();
          Store.write("notifications", id, {
            userId,
            message,
            taskId,
            type,
            read: false,
            sendDate: nowIso(),
          }).catch(() => {});
        }
        function addHistory(t, text) {
          const u = me();
          return [
            ...(t.history || []),
            { at: nowIso(), by: u ? u.id : null, text },
          ].slice(-25);
        }

        /* deadline reminders — one per task per due date, idempotent */
        function runReminders() {
          const u = me();
          if (!u || u.role !== "employee" || state.remindersRunFor === u.id)
            return;
          state.remindersRunFor = u.id;
          const lead = Number(Store.settings.reminderDays) || 2;
          scopedTasks(u)
            .filter(isOpen)
            .forEach((t) => {
              if (!t.dueDate || t.status === "submitted") return;
              const n = daysUntil(t.dueDate);
              let key = null,
                msg = null;
              if (n < 0) {
                key = "od";
                msg = `“${t.title}” is overdue (was due ${fmtShort(t.dueDate)}).`;
              } else if (n <= lead) {
                key = "ds";
                msg = `Reminder: “${t.title}” is ${relDue(t.dueDate).toLowerCase()}.`;
              }
              if (!key) return;
              const id = `rem-${key}-${t.id}-${t.dueDate}`.replace(
                /[^A-Za-z0-9_\-.~:@+]/g,
                "",
              );
              if (Store.data.notifications[id]) return;
              Store.write("notifications", id, {
                userId: u.id,
                message: msg,
                taskId: t.id,
                type: "reminder",
                read: false,
                sendDate: nowIso(),
              }).catch(() => {});
            });
        }

        /* ================= rendering ================= */
        let rafId = 0;
        function scheduleRender() {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            rafId = 0;
            render(true);
          });
        }
        let lastScreen = null;

        function captureInputs() {
          const root = document.getElementById("view");
          if (!root) return null;
          const m = {};
          root
            .querySelectorAll("input[name],select[name],textarea[name]")
            .forEach((el) => {
              const k = (el.form ? el.form.dataset.form : "") + "::" + el.name;
              m[k] = el.type === "checkbox" ? el.checked : el.value;
            });
          return m;
        }
        function restoreInputs(m) {
          if (!m) return;
          const root = document.getElementById("view");
          if (!root) return;
          root
            .querySelectorAll("input[name],select[name],textarea[name]")
            .forEach((el) => {
              const k = (el.form ? el.form.dataset.form : "") + "::" + el.name;
              if (k in m) {
                if (el.type === "checkbox") el.checked = m[k];
                else el.value = m[k];
              }
            });
        }

        function render(preserve = false) {
          const app = document.getElementById("app");
          if (!Store.ready) {
            return;
          }
          const u = me();
          const screen =
            users().length === 0 ? "setup" : u ? "shell" : state.auth;
          if (screen !== "shell") {
            if (lastScreen === screen) return; // keep typed credentials intact
            lastScreen = screen;
            app.innerHTML =
              screen === "setup"
                ? viewSetup()
                : screen === "forgot"
                  ? viewForgot()
                  : screen === "forgot-sent"
                    ? viewForgotSent()
                    : screen === "recover" && Store.mode === "local"
                      ? viewRecover()
                      : viewLogin();
            const f = app.querySelector("input");
            if (f && screen !== "login") f.focus();
            return;
          }
          if (!preserve || lastScreen !== "shell") {
            /* fresh */
          }
          const active = document.activeElement;
          const focusId =
            active && active.id && app.contains(active) ? active.id : null;
          const sel =
            focusId && typeof active.selectionStart === "number"
              ? [active.selectionStart, active.selectionEnd]
              : null;
          const saved =
            preserve && lastScreen === "shell" ? captureInputs() : null;
          const scroll = window.scrollY;
          lastScreen = "shell";
          app.innerHTML = viewShell(u);
          restoreInputs(saved);
          if (focusId) {
            const el = document.getElementById(focusId);
            if (el) {
              el.focus();
              if (sel && el.setSelectionRange)
                try {
                  el.setSelectionRange(sel[0], sel[1]);
                } catch {}
            }
          }
          if (preserve) window.scrollTo(0, scroll);
          runReminders();
        }
        function go(view) {
          state.view = view;
          state.report = view === "reports" ? state.report : state.report;
          render(false);
          window.scrollTo(0, 0);
          const h = document.querySelector("#view h1");
          if (h) {
            h.setAttribute("tabindex", "-1");
            h.focus({ preventScroll: true });
          }
        }

        function viewShell(u) {

          if (!t.dueDate) return '<span class="faint">No deadline</span>';

        function meter(pct, color = "var(--accent)") {
          return `<div class="meter"><div class="bar"><i style="width:${pct}%;background:${color}"></i></div><b>${pct}%</b></div>`;
        }
        function stackBar(c) {
          const tot = c.total || 1;
          return `<div class="bar stack-bar">${["completed", "submitted", "in_progress", "todo"].map((s) => (c[s] ? `<i style="width:${(c[s] / tot) * 100}%;background:${STATUS_COLOR[s]}"></i>` : "")).join("")}</div>`;
        }
        function donut(segs, label, sub) {
          const total = segs.reduce((a, s) => a + s.value, 0);
          const R = 52,
            C = 2 * Math.PI * R;
          let off = 0;
          const arcs = total
            ? segs
                .filter((s) => s.value)
                .map((s) => {
                  const len = (s.value / total) * C;
                  const el = `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
                  off += len;
                  return el;
                })
                .join("")
            : "";
          return `<div class="donut-wrap"><svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="${esc(label)} ${esc(sub)}">
    <circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--neutral-soft)" stroke-width="16"/>${arcs}
    <text x="66" y="64" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text)" font-family="Manrope, sans-serif">${esc(label)}</text>
    <text x="66" y="82" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Manrope, sans-serif">${esc(sub)}</text></svg>
    <div class="legend">${segs.map((s) => `<span><i style="background:${s.color}"></i>${s.label}<b>${s.value}</b></span>`).join("")}</div></div>`;
        }

    <div class="kpis">

            tasks = tasks.filter(
              (t) => (t.dueDate || t.assignedDate || "") >= from,

              "Overdue",
              "Progress",

              projectId === "all" || !projectId ? true : p.id === projectId,
            );
            rows = ps.map((p) => {
              const ts = tasks.filter((t) => t.projectId === p.id);
              const d = ts.filter((t) => t.status === "completed").length;
              return [
                p.name,
                PSTATUS[p.status] || p.status,
                ts.length,
                d,
                ts.filter((t) => t.status === "in_progress").length,
                ts.filter(isOverdue).length,
                (ts.length ? Math.round((d / ts.length) * 100) : 0) + "%",
              ];
            });
          } else if (type === "employee") {
            name = "Employee performance";
            columns = [
              "Employee",
              "Department",
              "Assigned",
              "Completed",
              "Open",
              "Overdue",
              "On-time rate",
            ];
            const ids = [...new Set(tasks.map((t) => t.assigneeId))];
            rows = ids
              .map((id) => {
                const x = userById(id);
                const ts = tasks.filter((t) => t.assigneeId === id);
                const done = ts.filter((t) => t.status === "completed");
                const onTime = done.filter(
                  (t) =>
                    !t.dueDate ||
                    !t.completedAt ||
                    t.completedAt.slice(0, 10) <= t.dueDate,
                ).length;
                return [
                  x ? x.name : "Former user",
                  x ? x.department || "—" : "—",
                  ts.length,
                  done.length,
                  ts.filter(isOpen).length,
                  ts.filter(isOverdue).length,
                  done.length
                    ? Math.round((onTime / done.length) * 100) + "%"
                    : "—",
                ];
              })
              .sort((a, b) => b[3] - a[3]);

            columns = [
              "Task",
              "Project",
              "Assigned to",
              "Priority",
              "Deadline",
              "Status",

          let dl = null;
          try {
            if (window.claude && window.claude.use)
              dl = await window.claude.use("downloads");
          } catch {}
          if (dl) {
            try {
              await dl.save({ filename: name, data: text });
              toast("Saved " + name);
            } catch (e) {
              if (!e || e.code !== "declined")
                toast("Couldn’t save the file. Try again.", "bad");
            }
            return;
          }
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([text], { type: mime }));

          document.body.appendChild(a);
          a.click();
          a.remove();

            const text =
              s === "in_progress"
                ? "started the task"
                : "moved it back to to do";
            await Store.patch("tasks", id, {
              status: s,
              updatedAt: nowIso(),
              history: addHistory(t, text),
            }).catch(() => {});
            closeModal();
            toast(s === "in_progress" ? "Task started" : "Moved to to do");
          },
          "task-submit"(id) {
            const t = Store.data.tasks[id];
            if (!t) return;
            formModal(
              "Submit task",
              esc(t.title),
              `<form data-form="submit" data-id="${id}" class="stack" novalidate>
      <div class="field"><label for="sb-note">What did you complete?</label><textarea class="input" id="sb-note" name="note" rows="4" placeholder="Summarise the work, add links, or flag anything your manager should check"></textarea></div>
      <div class="modal-f"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">${ic("send")}Submit task</button></div></form>`,
            );
          },
          async "task-approve"(id) {
            const t = Store.data.tasks[id];
            if (!t) return;
            await Store.patch("tasks", id, {
              status: "completed",
              completedAt: nowIso(),
              feedback: "",
              updatedAt: nowIso(),
              history: addHistory(t, "approved and completed the task"),
            }).catch(() => {});
            notify(
              t.assigneeId,
              `Your task “${t.title}” was approved.`,
              id,
              "approved",
            );
            closeModal();
            toast("Task approved");
          },
          "task-return"(id) {
            const t = Store.data.tasks[id];
            if (!t) return;
            formModal(
              "Return with feedback",
              esc(t.title),
              `<form data-form="return" data-id="${id}" class="stack" novalidate>
      <div class="field"><label for="rt-fb">What needs to change?</label><textarea class="input" id="rt-fb" name="feedback" rows="4" required></textarea></div>
      <p class="form-error" role="alert"></p>
      <div class="modal-f"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">${ic("undo")}Return task</button></div></form>`,
            );
          },

          /* notifications */
          async "notif-read"(id) {
            await Store.patch("notifications", id, { read: true }).catch(
              () => {},
            );
          },
          async "notif-open"(id) {
            const n = Store.data.notifications[id];
            if (!n) return;
            if (!n.read)
              Store.patch("notifications", id, { read: true }).catch(() => {});
            A["task-view"](n.taskId);
          },
          async "notif-allread"() {
            for (const n of myNotifs().filter((n) => !n.read)) {
              try {
                await Store.patch("notifications", n.id, { read: true });
              } catch {
                break;
              }
            }
            toast("All caught up");
          },
          async "notif-clear"() {
            const read = myNotifs().filter((n) => n.read);
            if (!read.length)
              return toast(
                "Only read notifications are cleared. Mark some as read first.",
              );
            if (
              !(await confirmBox(
                "Clear read notifications?",
                `${read.length} read notification${read.length > 1 ? "s" : ""} will be removed.`,
                "Clear",
              ))
            )
              return;
            for (const n of read) {
              try {
                await Store.remove("notifications", n.id);
              } catch {
                break;
              }
            }
            toast("Cleared");
          },

          /* reports */
          async "report-save"() {
            const r = state.report;
            if (!r) return;
            const id = uid();
            try {
              await Store.write("reports", id, r);
              state.report = null;
              state.f.ropen = id;
              toast("Report saved");
            } catch {}
          },
          "report-export"(id) {
            const r = id ? Store.data.reports[id] : state.report;
            if (r) exportReport(r);
          },
          "report-open"(id) {
            state.f.ropen = id;
            render(true);
            const el = document.getElementById("report-open");
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          },
          "report-close"() {
            state.f.ropen = null;
            render(true);
          },
          async "report-del"(id) {
            const r = Store.data.reports[id];
            if (!r) return;
            if (
              !(await confirmBox(
                "Delete this report?",
                `“${esc(r.reportName)}” will be removed for you and your admin.`,
                "Delete report",
              ))
            )
              return;
            if (state.f.ropen === id) state.f.ropen = null;
            await Store.remove("reports", id).catch(() => {});
            toast("Report deleted");
          },

          backup() {
            const data = {
              exportedAt: nowIso(),
              settings: Store.settings,
              ...Object.fromEntries(
                COLS.map((c) => [
                  c,
                  Store.list(c).map((x) => {
                    const y = { ...x };
                    delete y.passHash;
                    return y;
                  }),
                ]),
              ),
            };
            saveFile(
              "etms-backup-" + todayStr() + ".json",
              JSON.stringify(data, null, 2),
              "application/json",
            );
          },
        };

        /* ================= forms ================= */
        const F = {
          async login(f) {
            const email = f.email.value.trim().toLowerCase(),
              pw = f.password.value;
            const err = document.getElementById("login-err");
            if (!email || !pw) {
              err.textContent = "Enter your email and password.";
              return;
            }
            const u = users().find(
              (x) => (x.email || "").toLowerCase() === email,
            );
            const h = await hashPw(email, pw);
            if (!u || u.passHash !== h) {
              err.textContent =
                "That email and password don’t match. Check both and try again.";
              return;
            }
            if (u.active === false) {
              err.textContent =
                "This account is deactivated. Ask your administrator to reactivate it.";
              return;
            }
            sessionId = u.id;
            LS.set(SESSION_KEY, u.id);
            state.view = u.mustChangePw ? "profile" : "dashboard";
            state.auth = "login";
            state.loginNotice = null;
            lastScreen = null;
            Store.patch("users", u.id, { lastLogin: nowIso() }).catch(() => {});
            render();
          },
          async recover(f) {
            const err = document.getElementById("recover-err");
            if (Store.mode !== "local") return;
            const email = f.email.value.trim().toLowerCase(),
              pw = f.password.value;
            const u = users().find(
              (x) =>
                x.role === "admin" && (x.email || "").toLowerCase() === email,
            );
            if (!u) {
              err.textContent = "Choose an admin account.";
              return;
            }
            if (pw.length < 6) {
              err.textContent = "Use at least 6 characters.";
              return;
            }
            if (pw !== f.password2.value) {
              err.textContent = "The two passwords don’t match.";
              return;
            }
            await Store.patch("users", u.id, {
              passHash: await hashPw(u.email, pw),
              active: true,
              mustChangePw: false,
              lastLogin: nowIso(),
            });
            sessionId = u.id;
            LS.set(SESSION_KEY, u.id);
            state.view = "dashboard";
            state.auth = "login";
            lastScreen = null;
            render();
            toast("Password reset — you’re signed in");
          },
          async forgot(f) {
            const email = f.email.value.trim().toLowerCase();
            const note = f.note.value.trim().slice(0, 140);
            const err = document.getElementById("forgot-err");
            if (!/^\S+@\S+\.\S+$/.test(email)) {
              err.textContent = "Enter the email you sign in with.";
              return;
            }
            const btn = f.querySelector("[type=submit]");
            btn.disabled = true;
            const u = users().find(
              (x) =>
                (x.email || "").toLowerCase() === email && x.active !== false,
            );
            if (u) {
              const id = "rs-" + u.id;
              const already = !!Store.data.resets[id];
              try {
                await Store.write("resets", id, {
                  userId: u.id,
                  email,
                  note,
                  requestedAt: nowIso(),
                  status: "pending",
                });
                if (!already)
                  users()
                    .filter(
                      (a) =>
                        a.role === "admin" &&
                        a.active !== false &&
                        a.id !== u.id,
                    )
                    .forEach((a) =>
                      notify(
                        a.id,
                        `${u.name} (${u.email}) asked for a password reset.`,
                        null,
                        "reset",
                      ),
                    );
              } catch {
                btn.disabled = false;
                return;
              }
            }
            state.auth = "forgot-sent";
            lastScreen = null;
            render();
          },
          async setup(f) {
            const d = Object.fromEntries(new FormData(f));
            const err = document.getElementById("setup-err");
            if (!d.name.trim() || !d.email.trim() || !d.company.trim())
              return (err.textContent = "Fill in every field.");
            if (!/^\S+@\S+\.\S+$/.test(d.email.trim()))
              return (err.textContent = "Enter a valid email address.");
            if (d.password.length < 6)
              return (err.textContent =
                "Use a password with at least 6 characters.");
            const id = uid();
            const email = d.email.trim().toLowerCase();
            if (users().some((x) => (x.email || "").toLowerCase() === email))
              return (err.textContent =
                "An account with this email already exists. Sign in instead.");
            try {
              await Store.saveSettings({ companyName: d.company.trim() });
              await Store.write("users", id, {
                name: d.name.trim(),
                email,
                role: "admin",
                department: "Operations",
                active: true,
                passHash: await hashPw(email, d.password),
                createdAt: nowIso(),
                lastLogin: null,
              });
              state.auth = "login";
              state.loginNotice = email;
              sessionId = null;
              LS.set(SESSION_KEY, null);
              lastScreen = null;
              render();
              const pwEl = document.getElementById("l-pw");
              if (pwEl) pwEl.focus();
            } catch {}
          },
          async user(f) {
            const d = Object.fromEntries(new FormData(f));
            const id = f.dataset.id;
            const email = (d.email || "").trim().toLowerCase();
            if (!d.name.trim()) return formErr(f, "Enter their full name.");
            if (!/^\S+@\S+\.\S+$/.test(email))
              return formErr(f, "Enter a valid email address.");
            if (
              users().some(
                (x) => x.email.toLowerCase() === email && x.id !== id,
              )
            )
              return formErr(f, "Someone already uses that email.");
            if (id) {
              const x = userById(id);
              if (
                x.role === "admin" &&
                d.role !== "admin" &&
                users().filter((y) => y.role === "admin" && y.active !== false)
                  .length <= 1
              )
                return formErr(
                  f,
                  "Keep at least one admin. Make someone else an admin first.",
                );
              const patch = {
                name: d.name.trim(),
                role: d.role,
                department: d.department,
              };
              if (email !== x.email) {
                if ((d.password || "").length < 6)
                  return formErr(
                    f,
                    "Set a new password (6+ characters) when changing the email.",
                  );
                patch.email = email;
                patch.passHash = await hashPw(email, d.password);
              }
              await Store.patch("users", id, patch).catch(() => {});
              if (x.role !== d.role)
                notify(id, `Your role was changed to ${ROLES[d.role]}.`);
              closeModal();
              toast("Changes saved");
            } else {
              if ((d.password || "").length < 6)
                return formErr(f, "Use a password with at least 6 characters.");
              const nid = uid();
              try {
                await Store.write("users", nid, {
                  name: d.name.trim(),
                  email,
                  role: d.role,
                  department: d.department,
                  active: true,
                  passHash: await hashPw(email, d.password),
                  createdAt: nowIso(),
                  lastLogin: null,
                });
                notify(
                  nid,
                  `Welcome to ${Store.settings.companyName}! You were added as ${ROLES[d.role].toLowerCase()}.`,
                );
                closeModal();
                toast(`${d.name.trim()} added — password: ${d.password}`);
              } catch {}
            }
          },
          async resetpw(f) {
            const pw = f.password.value;
            if (pw.length < 6) return formErr(f, "Use at least 6 characters.");
            const x = userById(f.dataset.id);
            if (!x) return;
            try {
              await Store.patch("users", x.id, {
                passHash: await hashPw(x.email, pw),
                mustChangePw: true,
              });
            } catch {
              return;
            }
            const r = Store.data.resets["rs-" + x.id];
            if (r) Store.remove("resets", r.id).catch(() => {});
            notify(
              x.id,
              "An administrator reset your password. Choose a new one from your profile.",
              null,
              "reset-done",
            );
            openModal(`<div class="modal-h"><div><h2>Password reset</h2><p class="sub">Share this temporary password with ${esc(x.name)} (${esc(x.email)}) in person or through a private message.</p></div><button class="icon-btn sm" data-action="close" aria-label="Close">${ic("x")}</button></div>
      <div class="pw-show"><span id="tmp-pw">${esc(pw)}</span><button class="btn sm" data-action="copy-pw">Copy</button></div>
      <p class="muted" style="font-size:13.5px;margin-top:12px">After signing in they’ll be asked to set their own password.</p>
      <div class="modal-f"><button class="btn primary" data-action="close">Done</button></div>`);
          },
          async project(f) {
            const d = Object.fromEntries(new FormData(f));
            const id = f.dataset.id;
            const u = me();
            if (!d.name.trim()) return formErr(f, "Give the project a name.");
            if (d.startDate && d.endDate && d.endDate < d.startDate)
              return formErr(f, "The end date must be after the start date.");
            const body = {
              name: d.name.trim(),
              description: d.description.trim(),
              startDate: d.startDate,
              endDate: d.endDate,
              status: d.status,
            };
            if (id) {
              await Store.patch("projects", id, body).catch(() => {});
              closeModal();
              toast("Project updated");
            } else {
              const nid = uid();
              try {
                await Store.write("projects", nid, {
                  ...body,
                  managerId: u.id,
                  createdAt: nowIso(),
                });
                closeModal();
                toast("Project created");
              } catch {}
            }
          },
          async task(f) {
            const d = Object.fromEntries(new FormData(f));
            const id = f.dataset.id;
            const u = me();
            if (!d.title.trim()) return formErr(f, "Give the task a title.");
            if (!d.projectId) return formErr(f, "Choose a project.");
            if (!d.assigneeId)
              return formErr(f, "Choose who this task is assigned to.");
            if (!d.dueDate)
              return formErr(f, "Set a deadline so reminders work.");
            if (d.startDate && d.dueDate < d.startDate)
              return formErr(
                f,
                "The deadline must be on or after the start date.",
              );
            const body = {
              title: d.title.trim(),
              projectId: d.projectId,
              assigneeId: d.assigneeId,
              priority: d.priority,
              startDate: d.startDate,
              dueDate: d.dueDate,
              description: d.description.trim(),
              instructions: d.instructions.trim(),
              updatedAt: nowIso(),
            };
            if (id) {
              const t = Store.data.tasks[id];
              const changes = [];
              if (t.assigneeId !== d.assigneeId)
                changes.push(`reassigned to ${userName(d.assigneeId)}`);
              if (t.dueDate !== d.dueDate)
                changes.push(`moved the deadline to ${fmtShort(d.dueDate)}`);
              if (d.status && t.status !== d.status)
                changes.push(`set status to ${STATUS[d.status]}`);
              if (!changes.length) changes.push("edited the task details");
              const extra = d.status
                ? {
                    status: d.status,
                    ...(d.status === "completed" && !t.completedAt
                      ? { completedAt: nowIso() }
                      : {}),
                  }
                : {};
              await Store.patch("tasks", id, {
                ...body,
                ...extra,
                assignedDate:
                  t.assigneeId !== d.assigneeId ? todayStr() : t.assignedDate,
                history: addHistory(t, changes.join(", ")),
              }).catch(() => {});
              if (t.assigneeId !== d.assigneeId)
                notify(
                  d.assigneeId,
                  `${u.name} assigned you “${body.title}”, due ${fmtShort(d.dueDate)}.`,
                  id,
                  "assigned",
                );
              else if (t.dueDate !== d.dueDate)
                notify(
                  d.assigneeId,
                  `The deadline for “${body.title}” changed to ${fmtShort(d.dueDate)}.`,
                  id,
                  "info",
                );
              closeModal();
              toast("Task updated");
            } else {
              const nid = uid();
              try {
                await Store.write("tasks", nid, {
                  ...body,
                  status: "todo",
                  createdBy: u.id,
                  assignedDate: todayStr(),
                  createdAt: nowIso(),
                  history: [
                    {
                      at: nowIso(),
                      by: u.id,
                      text: `created and assigned to ${userName(d.assigneeId)}`,
                    },
                  ],
                });
                notify(
                  d.assigneeId,
                  `${u.name} assigned you “${body.title}”, due ${fmtShort(d.dueDate)}.`,
                  nid,
                  "assigned",
                );
                closeModal();
                toast(`Task assigned to ${userName(d.assigneeId)}`);
              } catch {}
            }
          },
          async submit(f) {
            const id = f.dataset.id;
            const t = Store.data.tasks[id];
            if (!t) return;
            const u = me();
            const note = f.note.value.trim();
            await Store.patch("tasks", id, {
              status: "submitted",
              submittedAt: nowIso(),
              submissionNote: note,
              updatedAt: nowIso(),
              history: addHistory(t, "submitted the task for review"),
            }).catch(() => {});
            notify(
              managerOf(t),
              `${u.name} submitted “${t.title}” for review.`,
              id,
              "review",
            );
            closeModal();
            toast("Task submitted");
          },
          async return(f) {
            const id = f.dataset.id;
            const t = Store.data.tasks[id];
            if (!t) return;
            const fb = f.feedback.value.trim();
            if (!fb) return formErr(f, "Tell them what to change.");
            await Store.patch("tasks", id, {
              status: "in_progress",
              feedback: fb,
              updatedAt: nowIso(),
              history: addHistory(t, "returned the task with feedback"),
            }).catch(() => {});
            notify(
              t.assigneeId,
              `“${t.title}” was returned: ${fb.slice(0, 120)}`,
              id,
              "returned",
            );
            closeModal();
            toast("Task returned");
          },
          report(f) {
            const d = Object.fromEntries(new FormData(f));
            if (d.from && d.to && d.to < d.from)
              return toast("The end date must be after the start date.", "bad");
            state.report = buildReport(me(), d.type, d.projectId, d.from, d.to);
            state.f.ropen = null;
            render(true);
          },
          async settings(f) {
            const d = Object.fromEntries(new FormData(f));
            if (!d.companyName.trim())
              return toast("Company name can’t be empty.", "bad");
            const deps = d.departments
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);
            try {
              await Store.saveSettings({
                companyName: d.companyName.trim(),
                departments: deps.length ? deps : DEFAULT_SETTINGS.departments,
                reminderDays: Number(d.reminderDays),
                defaultPriority: d.defaultPriority,
                showDemoLogins: !!f.showDemoLogins.checked,
              });
              toast("Settings saved");
            } catch {}
          },
          async profile(f) {
            const u = me();
            const name = f.name.value.trim();
            if (!name) return toast("Enter your name.", "bad");
            const patch = { name };
            if (u.role === "admin" && f.department)
              patch.department = f.department.value;
            await Store.patch("users", u.id, patch).catch(() => {});
            toast("Profile updated");
          },
          async password(f) {
            const u = me();
            const cur = f.current.value,
              nx = f.next.value;
            if ((await hashPw(u.email, cur)) !== u.passHash)
              return formErr(f, "Your current password is incorrect.");
            if (nx.length < 6)
              return formErr(
                f,
                "Use a new password with at least 6 characters.",
              );
            await Store.patch("users", u.id, {
              passHash: await hashPw(u.email, nx),
              mustChangePw: false,
            }).catch(() => {});
            f.reset();
            formErr(f, "");
            toast("Password updated");
          },
        };

        /* ================= event delegation ================= */
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-action]");
          if (!el) return;
          const raw = el.dataset.action;
          const i = raw.indexOf(":");
          const name = i < 0 ? raw : raw.slice(0, i),
            arg = i < 0 ? "" : raw.slice(i + 1);
          if (name === "bg-close") {
            A["bg-close"](arg, el, e);
            return;
          }
          if (A[name]) {
            e.preventDefault();
            e.stopPropagation();
            A[name](arg, el, e);
          }
        });
        document.addEventListener("keydown", (e) => {
          if (
            e.key === "Escape" &&
            document.getElementById("modal-root").innerHTML
          ) {
            if (confirmResolve) {
              confirmResolve(false);
              confirmResolve = null;
            }
            closeModal();
          }
          if (
            (e.key === "Enter" || e.key === " ") &&
            e.target.matches('[role="button"][data-action], tr[data-action]')
          ) {
            e.preventDefault();
            e.target.click();
          }
        });
        document.addEventListener("submit", (e) => {
          const f = e.target.closest("form[data-form]");
          if (!f) return;
          e.preventDefault();
          const fn = F[f.dataset.form];
          if (fn) fn(f);
        });
        document.addEventListener("input", (e) => {
          const el = e.target.closest("[data-filter]");
          if (!el) return;
          state.f[el.dataset.filter] = el.value;
          render(true);
        });

        /* ================= boot ================= */
        Store.init().then(() => render());
      })();
    </script>
  </body>
</html>
